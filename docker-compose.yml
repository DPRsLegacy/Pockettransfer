services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pockettransfer}
      POSTGRES_USER: ${POSTGRES_USER:-pockettransfer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pockettransfer-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pockettransfer} -d ${POSTGRES_DB:-pockettransfer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PT_DETAILED_ERRORS: ${PT_DETAILED_ERRORS:-false}
      ConnectionStrings__Bank: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-pockettransfer};Username=${POSTGRES_USER:-pockettransfer};Password=${POSTGRES_PASSWORD}
      Bank__AdminUsernames: ${PT_ADMIN_USERNAMES:-}
    ports:
      - "8080:8080"
    volumes:
      - pockettransfer-data:/app/Data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      BANK_DOMAIN: ${BANK_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    profiles: ["tls"]

volumes:
  pockettransfer-pg:
  pockettransfer-data:
  caddy-data:
  caddy-config:
